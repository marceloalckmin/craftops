services:
  mc:
    image: itzg/minecraft-server:java21
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      DIFFICULTY: "hard"
      PACKWIZ_URL: ${PACKWIZ_URL}
      NEOFORGE_VERSION: ${NEOFORGE_VERSION}
      MEMORY: ${MC_MEMORY}
      OPS: ${OPS}
      ONLINE_MODE: "FALSE"
      MOTD: "§6R8US SERVER - BEM VINDO (PRA ALGUNS)"
      ICON: "server-icon.png"



    volumes:
      - ./minecraft-data:/data
      - ./mods:/mods
    
    extra_hosts:
      - "host.docker.internal:host-gateway"